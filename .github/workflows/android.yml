name: Android APK
on:
  push:
    branches: [feature/android-camera, bootstrap]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Install Android and NDI SDKs
        shell: pwsh
        run: ./setup.ps1
      - name: Compile and verify APK with CI-only key
        shell: pwsh
        run: ./build.ps1 -DebugSigning
      - uses: actions/upload-artifact@v4
        with:
          name: NDICamera-debug
          path: dist/*-debug.apk
